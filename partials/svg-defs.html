         CSS gradient cannot fill an SVG path. A horizontal ramp turned
         -40.82 in object bounding box space points up and to the right,
         which is the mark's own diagonal. Both brand colours are present,
         which is the rule: neither is ever a field on its own. -->
    <linearGradient id="xg" x1="0" y1="0.5" x2="1" y2="0.5"
