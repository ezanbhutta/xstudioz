<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 108 108">
  <!-- THE FAVICON VARIANT, NOT THE MASTER, AND THE DIFFERENCE IS A 16px
       PROBLEM RATHER THAN A TASTE. Inside one arm the section is ink,
       counter, ink, and it is fixed at P * sqrt2, so at 16px the master's
       ribbon lands at 2.17px and its counter at 2.32px with a 1.6px step
       whose ink neck is 0.86px: two features under one pixel, which render
       as grey smear at the upper left and lower right. This drawing widens
       the arm (P 0.589 -> 0.630), which is the only lever that gives ink and
       counter both more room: ribbon 2.35px, counter 2.43px, no step, and a
       corner radius of 1.20 percent, which is 0.19px and lands clean where
       the master's 3.00 percent could only produce grey.

       Generated by .spec/logo-lab/tools; geometry in out/favicon.svg.

       THE VIEWBOX CARRIES THE CLEARSPACE. The delivered artwork's painted
       box is exactly 0,0,100,100, so a file that showed it at its own extent
       would touch all four edges of a browser tab. Four units of pad each
       side is 0.6px at 16 and holds the drawing off the edge without
       spending ink on air.

       ONE FILE, BOTH BROWSER THEMES. The fill is set by a style block with a
       prefers-color-scheme branch rather than by a gradient, because the
       shipped favicon was a two-stop brand ramp and there is no brand ramp
       at this scale any more. -->
  <style>
    .ink { fill: #0b0b0c }
    @media (prefers-color-scheme: dark) { .ink { fill: #f4f3f1 } }
  </style>
